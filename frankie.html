<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frankie — F4N Intelligence by NucCol</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08111f;
  --surface:#0d1e35;
  --surface2:#112440;
  --border:rgba(41,182,232,0.15);
  --cyan:#29b6e8;
  --purple:#7c3aed;
  --amber:#f59e0b;
  --text:rgba(232,238,246,0.9);
  --muted:rgba(232,238,246,0.45);
  --pro-gate:rgba(245,158,11,0.12);
}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:780px;background:var(--surface);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;height:min(680px,calc(100vh - 32px));box-shadow:0 24px 80px rgba(0,0,0,0.6),0 0 0 1px var(--border)}

/* HEADER */
.hdr{background:var(--surface2);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.avatar{width:46px;height:46px;flex-shrink:0}
.hdr-text{flex:1;min-width:0}
.hdr-name{font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan);line-height:1;display:flex;align-items:center;gap:8px}
.hdr-name span.tag{font-size:.6rem;font-weight:700;letter-spacing:.12em;background:var(--purple);color:#fff;padding:2px 7px;border-radius:2px;vertical-align:middle}
.hdr-sub{font-size:.67rem;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.tier-row{display:flex;gap:6px;align-items:center;flex-shrink:0}
.tier-btn{font-family:'Barlow Condensed',sans-serif;font-size:.67rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:3px;cursor:pointer;border:none;transition:all .15s}
.btn-free{background:rgba(41,182,232,.1);color:var(--cyan);border:1px solid rgba(41,182,232,.3)}
.btn-pro{background:var(--cyan);color:var(--bg)}
.btn-inactive{opacity:.4}

/* DISCLAIMER */
.disc{background:rgba(41,182,232,.05);border-bottom:1px solid rgba(41,182,232,.1);padding:5px 18px;font-size:.66rem;color:var(--muted);display:flex;align-items:center;gap:6px;flex-shrink:0}
.disc::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--amber);flex-shrink:0}

/* MESSAGES */
.msgs{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:rgba(41,182,232,.15) transparent}
.row{display:flex;gap:8px;max-width:96%}
.row.user{align-self:flex-end;flex-direction:row-reverse}
.ico{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px}
.ico.bot{background:var(--surface2);border:1px solid rgba(41,182,232,.22)}
.ico.bot svg{width:16px;height:16px}
.ico.usr{background:rgba(41,182,232,.12);color:var(--cyan);font-size:9px;font-weight:700;letter-spacing:.02em;font-family:'Barlow Condensed',sans-serif}
.bub{padding:9px 13px;border-radius:7px;font-size:.8rem;line-height:1.65}
.bub.bot{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:2px 7px 7px 7px}
.bub.usr{background:var(--cyan);color:var(--bg);font-weight:500;border-radius:7px 2px 7px 7px}
.bub.gate{background:var(--surface2);border:1px solid rgba(245,158,11,.2);color:var(--muted);border-radius:2px 7px 7px 7px}
.bub b,.bub strong{color:var(--cyan);font-weight:600;font-style:normal}
.bub em{color:var(--muted);font-size:.74rem}

/* SUGGESTIONS */
.sugs{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.sug{background:rgba(41,182,232,.07);border:1px solid rgba(41,182,232,.17);color:var(--cyan);font-size:.73rem;padding:5px 9px;border-radius:4px;cursor:pointer;text-align:left;font-family:'Barlow',sans-serif;transition:background .12s;line-height:1.4}
.sug:hover{background:rgba(41,182,232,.14)}

/* VIDEO CARDS */
.vids{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vid-card{display:flex;align-items:center;gap:7px;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.2);border-radius:5px;padding:5px 9px;text-decoration:none;color:var(--text);font-size:.72rem;transition:background .12s;max-width:280px}
.vid-card:hover{background:rgba(124,58,237,.2)}
.vid-card .play{width:20px;height:20px;background:var(--purple);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vid-card .play svg{width:10px;height:10px;fill:#fff;margin-left:1px}
.vid-label{font-size:.69rem;color:var(--muted);line-height:1.3}

/* LINKS */
.link-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.ext-link{font-size:.72rem;color:var(--cyan);background:rgba(41,182,232,.07);border:1px solid rgba(41,182,232,.2);border-radius:4px;padding:3px 8px;text-decoration:none;transition:background .12s}
.ext-link:hover{background:rgba(41,182,232,.15)}

/* UPGRADE PROMPT */
.upg{background:var(--pro-gate);border:1px solid rgba(245,158,11,.18);border-radius:5px;padding:9px 12px;margin-top:7px;font-size:.73rem;color:rgba(255,200,80,.85)}
.upg-btn{background:var(--amber);color:var(--bg);border:none;border-radius:3px;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;cursor:pointer;margin-top:6px;display:inline-block}

/* TYPING */
.typing{display:flex;gap:3px;align-items:center;padding:5px 0}
.typing span{width:5px;height:5px;background:var(--cyan);border-radius:50%;animation:dk 1.2s infinite;opacity:.3}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes dk{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* INPUT */
.inp-row{border-top:1px solid var(--border);padding:12px 18px;display:flex;gap:8px;flex-shrink:0;background:var(--bg)}
.inp{flex:1;background:var(--surface2);border:1px solid rgba(41,182,232,.2);border-radius:4px;color:var(--text);font-family:'Barlow',sans-serif;font-size:.8rem;padding:9px 12px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--cyan)}
.inp::placeholder{color:var(--muted)}
.send{background:var(--cyan);border:none;border-radius:4px;color:var(--bg);font-family:'Barlow Condensed',sans-serif;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 16px;cursor:pointer;transition:background .15s;flex-shrink:0;white-space:nowrap}
.send:hover{background:#1a96c8}
.send:disabled{opacity:.35;cursor:not-allowed}

/* SECTION BADGE */
.sec-badge{display:inline-block;font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:2px;margin-bottom:5px}
.sec-be{background:rgba(41,182,232,.15);color:var(--cyan)}
.sec-nuc{background:rgba(239,68,68,.15);color:#f87171}
.sec-hub{background:rgba(124,58,237,.15);color:#a78bfa}
</style>
</head>
