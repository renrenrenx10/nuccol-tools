function makeVidCard(ytId){
  return `<a class="vid-card" href="https://www.youtube.com/watch?v=${ytId}" target="_blank" rel="noopener">
    <div class="play"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>
    <span class="vid-label">Watch on YouTube</span>
  </a>`;
}

function makeLinkCard(url, label){
  return `<a class="ext-link" href="${url}" target="_blank" rel="noopener">${label} ↗</a>`;
}

function addMsg(msg){
  const c = document.getElementById('msgs');
  const row = document.createElement('div');
  row.className = 'row' + (msg.bot ? '' : ' user');

  const ico = document.createElement('div');
  ico.className = 'ico ' + (msg.bot ? 'bot' : 'usr');
  ico.innerHTML = msg.bot ? avSvg() : 'YOU';

  const bub = document.createElement('div');
  bub.className = 'bub ' + (msg.gate ? 'gate' : msg.bot ? 'bot' : 'usr');

  let html = '';
  if(msg.badge) html += `<div class="sec-badge ${msg.badge}">${msg.badgeLabel}</div>`;
  if(msg.gate){
    html += `🔒 This is member-only content — the full handbook guidance, implementation detail, and video resources for this topic.<div class="upg">F4N members get Frankie as part of their £3k/year subscription — including both handbooks, all 86 question guides, sector intelligence, and video resources.<br><button class="upg-btn" onclick="setTier('pro')">Unlock Member Access</button></div>`;
  } else {
    html += (msg.text||'').replace(/\n/g,'<br/>');
    if(msg.vids && msg.vids.length){
      html += '<div class="vids">' + msg.vids.map(makeVidCard).join('') + '</div>';
    }
    if(msg.links && msg.links.length){
      html += '<div class="link-row">' + msg.links.map(l => makeLinkCard(l.url, l.label)).join('') + '</div>';
    }
    if(msg.sugs && msg.sugs.length){
      const sd = document.createElement('div');
      sd.className = 'sugs';
      // We'll append this after setting innerHTML
      bub.innerHTML = html;
      msg.sugs.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'sug';
        btn.textContent = '↳ ' + s;
        btn.onclick = () => { document.getElementById('inp').value = s; sendMsg(); };
        sd.appendChild(btn);
      });
      bub.appendChild(sd);
      row.appendChild(ico);
      row.appendChild(bub);
      c.appendChild(row);
      c.scrollTop = c.scrollHeight;
      return;
    }
  }
  bub.innerHTML = html;
  row.appendChild(ico);
  row.appendChild(bub);
  c.appendChild(row);
  c.scrollTop = c.scrollHeight;
}

// ── KNOWLEDGE MATCHING ──
function searchBE(q){
  const t = q.toLowerCase();
  // Check each category and chapter
  for(const [catKey, cat] of Object.entries(KB.be_handbook)){
    if(t.includes(cat.label.toLowerCase())) return {type:'be_cat', catKey, cat};
    for(const ch of cat.chapters){
      const id = (ch.id||'').toLowerCase();
      const title = ch.title.toLowerCase();
      if(t.includes(id) || title.split(' ').filter(w=>w.length>4).some(w=>t.includes(w))){
        return {type:'be_ch', catKey, cat, ch};
      }
    }
  }
  return null;
}

function searchNuclear(q){
  const t = q.toLowerCase();
  for(const [catKey, cat] of Object.entries(KB.nuclear_handbook)){
    if(t.includes(cat.label.toLowerCase())) return {type:'nuc_cat', catKey, cat};
    for(const ch of cat.chapters){
      const id = (ch.id||'').toLowerCase();
      const title = ch.title.toLowerCase();
      if(t.includes(id) || title.split(' ').filter(w=>w.length>4).some(w=>t.includes(w))){
        return {type:'nuc_ch', catKey, cat, ch};
      }
    }
  }
  return null;
}

function searchHub(q){
  const t = q.toLowerCase();
  const results = {};
  
  // Pipeline
  if(t.match(/pipeline|programme|project|hinkley|sizewell|sellafield|smr|rolls.royce|wylfa|dreadnought|decommission|step|fusion/)){
    results.pipeline = KB.hub.pipeline.filter(p => 
      t.includes(p.programme.toLowerCase()) || 
      t.includes(p.sector.toLowerCase()) ||
      t.match(/pipeline|programme|all programme/)
    ).slice(0, 6);
    if(!results.pipeline.length) results.pipeline = KB.hub.pipeline.slice(0,6);
  }
  
  // Stakeholders
  if(t.match(/organisation|stakeholder|association|body|institute|who is|who does|contact|directory/)){
    results.stakeholders = KB.hub.stakeholders.filter(s =>
      t.includes(s.name.toLowerCase()) ||
      t.includes((s.cat||'').toLowerCase()) ||
      t.match(/stakeholder|all org/)
    ).slice(0,5);
    if(!results.stakeholders.length) results.stakeholders = KB.hub.stakeholders.slice(0,5);
  }
  
  // Funding
  if(t.match(/fund|grant|money|finance|invest|ukri|innovate|desnz/)){
    results.funding = KB.hub.funding.slice(0,5);
  }
  
  // Skills
  if(t.match(/skill|training|workforce|apprentice|nia|cogent/)){
    results.skills = KB.hub.skills.slice(0,4);
  }
  
  // Sellafield
  if(t.match(/sellafield|product demand|hfc|compaction/)){
    results.sellafield = KB.hub.sellafield;
  }
  
  // Portals
  if(t.match(/portal|contract|tender|procurement|find work|bid/)){
    results.portals = KB.hub.portals.slice(0,5);
  }
  
  return Object.keys(results).length ? results : null;
}

function getIntent(q){
  const t = q.toLowerCase();
  
  // Core F4N programme questions (free)
  if(t.match(/what is f4n|fit for nuclear|about f4n|f4n programme|tell me about/)) return 'f4n_overview';
  if(t.match(/stage|journey|8 stage|process step|how long/)) return 'stages';
  if(t.match(/triple.?85|granting criter|85.?per/)) return 'triple85';
  if(t.match(/scor|0.*2.*7.*10|scoring system|how.*score/)) return 'scoring';
  if(t.match(/cost|price|how much|£3k|subscribe|annual fee|maintain/)) return 'cost';
  if(t.match(/impact|track.?record|contract.*won|£2.1|jobs.*creat|proven/)) return 'impact';
  if(t.match(/granting panel|panel.*assess|what.*panel/)) return 'granting_panel';

  // BE Handbook (pro)
  const beMatch = searchBE(q);
  if(beMatch) return {type:'be', match:beMatch};
  
  // Nuclear Handbook (pro)
  const nucMatch = searchNuclear(q);
  if(nucMatch) return {type:'nuclear', match:nucMatch};
  
  // Hub intelligence (pro)
  const hubMatch = searchHub(q);
  if(hubMatch) return {type:'hub', match:hubMatch};
  
  // Core knowledge (free)
  if(t.match(/sqep|qualified.*experience|competence.*people/)) return 'sqep';
  if(t.match(/cfsi|counterfeit|fraudulent|suspect.item/)) return 'cfsi';
  if(t.match(/osv|on.?site.?verif|site visit/)) return 'osv';
  if(t.match(/iso|19443|9001|45001|14001|ukas/)) return 'iso';
  if(t.match(/onr|office.*nuclear|regulat|tag.?77|alarp|graded approach/)) return 'onr';
  if(t.match(/nss|nuclear.*sector.*spec|safety.culture assess/)) return 'nss';
  if(t.match(/action.?plan|improvement.?plan/)) return 'action_plan';
  if(t.match(/portal|dashboard|upload|submit.*(portal|assessment)/)) return 'portal';
  if(t.match(/hinkley|sizewell|rolls.royce|smr|sellafield|nda|dreadnought|programme|new build/)) return 'programmes';
  
  return 'fallback';
}

// ── RESPONSE BUILDER ──
function buildBEResponse(match){
  if(match.type === 'be_cat'){
    const cat = match.cat;
    const vids = cat.videos && cat.videos.length ? cat.videos : [];
    const chList = cat.chapters.map(ch => `• <b>${ch.id}</b>: ${ch.title}`).join('\n');
    return {
      badge:'sec-be', badgeLabel: cat.label,
      text:`<b>${cat.label}</b> — Business Excellence Handbook\n\nThis category covers ${cat.chapters.length} areas. Here's what's included:\n\n${chList}\n\n<em>Ask me about any specific topic for full implementation guidance.</em>`,
      vids: vids.slice(0,2),
      sugs: cat.chapters.slice(0,3).map(ch => `How do I implement ${ch.title}?`)
    };
  }
  if(match.type === 'be_ch'){
    const ch = match.ch;
    const cat = match.cat;
    const vids = ch.videos && ch.videos.length ? ch.videos : (cat.videos ? cat.videos.slice(0,2) : []);
    return {
      badge:'sec-be', badgeLabel: `BE · ${ch.id}`,
      text:`<b>${ch.title}</b>\n\n${ch.summary.slice(0,800)}${ch.summary.length > 800 ? '...' : ''}`,
      vids,
      sugs:[
        `What evidence does an SCC need for ${ch.title}?`,
        `How do I score 7 on ${ch.title}?`,
        `What are common mistakes in ${ch.title}?`
      ]
    };
  }
}

function buildNuclearResponse(match){
  if(match.type === 'nuc_cat'){
    const cat = match.cat;
    const chList = cat.chapters.map(ch => `• <b>${ch.id}</b>: ${ch.title}`).join('\n');
    return {
      badge:'sec-nuc', badgeLabel: cat.label,
      text:`<b>${cat.label}</b> — Nuclear Sector Handbook\n\nThis section covers ${cat.chapters.length} topics:\n\n${chList}\n\n<em>Ask me about any specific topic for full nuclear guidance.</em>`,
      sugs: cat.chapters.slice(0,3).map(ch => `Tell me about ${ch.title}`)
    };
  }
  if(match.type === 'nuc_ch'){
    const ch = match.ch;
    return {
      badge:'sec-nuc', badgeLabel: `Nuclear · ${ch.id}`,
      text:`<b>${ch.title}</b>\n\n${ch.summary.slice(0,800)}${ch.summary.length > 800 ? '...' : ''}`,
      sugs:[
        `What does ONR expect for ${ch.title}?`,
        `How does this link to the NSS assessment?`,
        `What evidence is needed for ${ch.title}?`
      ]
    };
  }
}

function buildHubResponse(match){
  let text = '';
  let links = [];
  let sugs = [];
  
  if(match.pipeline && match.pipeline.length){
    text += '<b>UK Nuclear Pipeline</b>\n\n';
    match.pipeline.forEach(p => {
      text += `<b>${p.programme}</b> (${p.sector}) — Confidence: ${p.confidence}\n`;
      if(p.comment) text += `<em>${p.comment}</em>\n`;
      text += '\n';
    });
    sugs.push('What funding is available for nuclear companies?','Which organisations should I know about?');
  }
  
  if(match.stakeholders && match.stakeholders.length){
    if(text) text += '\n';
    text += '<b>Key Organisations</b>\n\n';
    match.stakeholders.forEach(s => {
      text += `<b>${s.name}</b> (${s.cat})\n${s.desc}\n\n`;
      if(s.url) links.push({url: s.url, label: s.name});
    });
    sugs.push('Show me funding sources','What portals can I find contracts on?');
  }
  
  if(match.funding && match.funding.length){
    if(text) text += '\n';
    text += '<b>Funding Sources</b>\n\n';
    match.funding.forEach(f => {
      text += `<b>${f.org}</b> — ${f.value}\n${f.summary}\n\n`;
      if(f.url) links.push({url: f.url, label: f.org});
    });
    sugs.push('What portals can I find contracts on?','Tell me about Sellafield product demand');
  }
  
  if(match.skills && match.skills.length){
    if(text) text += '\n';
    text += '<b>Skills & Training Organisations</b>\n\n';
    match.skills.forEach(s => {
      text += `<b>${s.name}</b>\n${s.what}\n<em>Offers: ${s.offers}</em>\n\n`;
      if(s.url) links.push({url: s.url, label: s.name});
    });
  }
  
  if(match.sellafield && match.sellafield.length){
    if(text) text += '\n';
    text += '<b>Sellafield Product Demand</b>\n\n';
    match.sellafield.forEach(s => {
      text += `<b>${s.product}</b>\nDemand: ${s.sub||''}  ${s.demand||''}\n${s.note ? `<em>${s.note}</em>` : ''}\n\n`;
    });
    sugs.push('Tell me about the full nuclear pipeline','What funding is available?');
  }
  
  if(match.portals && match.portals.length){
    if(text) text += '\n';
    text += '<b>Contract & Procurement Portals</b>\n\n';
    match.portals.forEach(p => {
      text += `<b>${p.name}</b>\n${p.desc}\n\n`;
      if(p.url) links.push({url: p.url, label: p.name});
    });
    sugs.push('Tell me about funding sources','What organisations are in the sector?');
  }
  
  if(!text) return null;
  
  return {
    badge:'sec-hub', badgeLabel:'Sector Intelligence',
    text: text.trim(),
    links: links.slice(0,6),
    sugs: sugs.slice(0,3)
  };
}

// ── MAIN RESPONSE ──
function getResponse(q){
  const intent = getIntent(q);
  
  // String intents = core knowledge (free)
  if(typeof intent === 'string'){
    if(CORE[intent]) return {gated: false, data: CORE[intent]};
    
    // Fallback
    if(tier === 'free'){
      return {gated: false, data:{
        text:`Good question. On the free tier I can cover F4N programme fundamentals — what it is, the 8 stages, granting criteria, scoring, SQEP, CFSI, ISO standards and ONR context.

For specific implementation guidance on all 86 F4N questions, nuclear sector handbook, sector intelligence, pipeline data, funding sources, and video resources — that's in the member area.

What would you like to know about the core programme?`,
        sugs:['What is F4N?','What are the 8 stages?','What is the Triple 85?']
      }};
    }
    
    return {gated: false, data:{
      text:`I have detailed knowledge across the F4N programme, Business Excellence handbook, Nuclear sector handbook, and UK nuclear sector intelligence. Try asking about a specific area — a BE question ID like "STR04", a nuclear topic like "safety culture" or "human performance", or sector questions like "funding sources" or "UK pipeline".`,
      sugs:['Show me the BE handbook categories','What does SAF01 cover?','What funding is available for nuclear companies?']
    }};
  }
  
  // Object intents = handbook/hub (pro only on free tier)
  if(tier === 'free'){
    return {gated: true};
  }
  
  // Build the response
  if(intent.type === 'be'){
    const resp = buildBEResponse(intent.match);
    if(resp) return {gated: false, data: resp};
  }
  if(intent.type === 'nuclear'){
    const resp = buildNuclearResponse(intent.match);
    if(resp) return {gated: false, data: resp};
  }
  if(intent.type === 'hub'){
    const resp = buildHubResponse(intent.match);
    if(resp) return {gated: false, data: resp};
  }
  
  // Pro fallback
  return {gated: false, data:{
    badge:'sec-be', badgeLabel:'F4N Intelligence',
    text:`I have the full F4N handbook, nuclear sector guidance, and sector intelligence loaded. Try asking about a specific question (e.g. "STR04 Leading Change", "QHS05 CFSI", "SAF01 Safety Culture"), a category ("Process Excellence"), or intelligence topics ("UK funding sources", "nuclear pipeline", "key stakeholders").`,
    sugs:['Show me the nuclear handbook categories','What does CFSI implementation require?','Show me UK nuclear funding sources']
  }};
}

// ── SEND ──
function handleKey(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); } }

function sendMsg(){
  if(busy) return;
  const inp = document.getElementById('inp');
  const q = inp.value.trim();
  if(!q) return;
  inp.value = '';
  addMsg({bot: false, text: q});
  busy = true;
  document.getElementById('snd').disabled = true;
  showTyping();
  setTimeout(() => {
    removeTyping();
    const resp = getResponse(q);
    if(resp.gated){
      addMsg({bot: true, gate: true});
    } else {
      addMsg({bot: true, ...resp.data});
    }
    busy = false;
    document.getElementById('snd').disabled = false;
  }, 600 + Math.random()*500);
}
